# OpenContext Configuration
# ==========================
#
# San Diego GIS MCP — derived from config-example.yaml.
#
# IMPORTANT: Enable ONLY ONE plugin per fork/deployment (One Fork = One MCP Server).
# See docs/ARCHITECTURE.md for details.

---
# Server metadata
server_name: "San Diego Regional GIS MCP"
description: >-
  San Diego REGIONAL GIS MCP server - safe, conversational access to the
  SANDAG-hosted regional / SanGIS catalog (geo.sandag.org): parcels,
  floodplain, address points, regional transportation and land use.
  Authoritative City of San Diego municipal layers (MHPA, City base zoning,
  community-plan land use) live on the separate "San Diego City" server.
organization: "SANDAG/SanGIS"
# Surfaced in the MCP `initialize` response as serverInfo.version. Bump it
# with any behaviour change worth telling a client apart by.
server_version: "1.1.0"

# Per-deployment guidance returned in the MCP `initialize` response as
# `instructions`. Model-agnostic: clients prepend it to the model's context
# once, before any tool is called, so this is the highest-leverage place for
# the workflow, the coordinate-system facts, attribution, and routing to the
# sibling City server. Shipped inside the Lambda package (not the 4KB env
# var) -- see scripts/deploy.sh.
instructions: |
  You are connected to the SANDAG/SanGIS REGIONAL GIS catalog for the San
  Diego region (geo.sandag.org): parcels, floodplain, address points,
  regional transportation and land use, and hundreds of other layers
  published by SANDAG and its member agencies.

  Workflow:
  1. search_datasets(q, type='Feature Service') to find queryable layers.
     Each result shows a dataset ID (a 32-char portal item ID or a
     'Folder/Service/FeatureServer' path); pass that ID to the other tools.
  2. get_layer_schema(item_id) BEFORE writing any WHERE clause: field names
     are CASE-SENSITIVE and coded-value domains are listed there. Use
     get_distinct_values to confirm the exact spelling of a code.
  3. query_data for records and counts -- the response leads with TOTAL
     MATCHING, so 'how many X?' questions need no paging -- and
     spatial_query_point with a street address or lon/lat for 'what parcel /
     flood zone / district is at this location?'.

  Data facts to apply to every answer:
  - Coordinates in and out are WGS84 (EPSG:4326). Layers are stored in CA
    State Plane Zone VI (US feet); the server converts, you never need to.
  - Every data response ends with a SanGIS attribution line. Keep that
    attribution with any figures or records you report.
  - An empty result means no records matched the filter, not that the layer
    or the feature is missing: re-check the schema and distinct values.
  - Some catalog folders (e.g. GeoDepot) are sign-in only and are not
    searchable here.

  Scope: this server is the REGIONAL catalog only. Authoritative City of San
  Diego municipal layers (MHPA, City base zoning, community-plan land use)
  live on the separate 'San Diego City GIS' MCP server -- use that server for
  City municipal questions.

  All tools are READ-ONLY and safe to call without confirmation.


# Plugin configuration
# ====================
#
# IMPORTANT: Enable ONLY ONE plugin below
# For additional MCP servers, fork this repository again
#
plugins:
  # Built-in: CKAN (for CKAN-based open data portals)
  ckan:
    enabled: false # Set to true to use
    base_url: "https://data.example.gov/" # CKAN API base URL
    portal_url: "https://data.example.gov/" # Public portal URL
    city_name: "Your City" # City/organization name
    timeout: 120 # HTTP timeout in seconds
    # api_key: "${CKAN_API_KEY}"  # Optional: CKAN API key for authenticated requests

  # Built-in: ArcGIS Enterprise portal
  # SANDAG/SanGIS regional GIS: portal search for discovery, with the
  # services directory as fallback; layers stored in EPSG:2230 (queries
  # pin outSR=4326).
  arcgis:
    enabled: true # Set to true to use
    portal_url: "https://geo.sandag.org/portal"
    services_url: "https://geo.sandag.org/server/rest/services"
    # geocoder_url is intentionally unset: gis.sandag.org re-issued its
    # certificate on 2026-07-08 under a GoDaddy chain that certifi (Mozilla
    # roots) cannot verify, so every geocode through the SANDAG composite
    # locator failed with CERTIFICATE_VERIFY_FAILED. The copy of the locator
    # on geo.sandag.org verifies but has no city names in its reference data
    # ('202 C St, San Diego' -> Oceanside). Until the chain is fixed, the US
    # Census geocoder fallback below is used (biased by geocoder_region).
    # geocoder_url: "https://gis.sandag.org/sdgis/rest/services/SANDAG_COMPOSITE_LOCATOR/GeocodeServer"
    city_name: "the San Diego region"
    scope_note: >-
      This is the SANDAG/SanGIS REGIONAL catalog. Authoritative City of San
      Diego municipal layers (MHPA, City base zoning, community-plan land
      use) are NOT here -- they live on the separate 'San Diego City' MCP
      server; use that server for City municipal questions.
    # 25s, not 120: API Gateway hard-caps responses at 29s, so an upstream
    # timeout must fire BEFORE that to reach the client as a clean JSON-RPC
    # error instead of an opaque 504. Normal SANDAG queries finish in <5s.
    timeout: 25
    geocoder_region: "San Diego, CA" # biases the US Census fallback geocoder
    # token: "${ARCGIS_TOKEN}"  # Optional: Bearer token for private items

# AWS deployment settings
aws:
  region: "us-west-2" # AWS region for Lambda
  lambda_name: "sandiego-gis-mcp" # Lambda function name
  lambda_memory: 512 # Lambda memory in MB (128-10240)
  lambda_timeout: 120 # Lambda timeout in seconds (max 900)

# Logging configuration
logging:
  level: "INFO" # Log level: DEBUG, INFO, WARNING, ERROR
  format: "json" # Log format: json or text
