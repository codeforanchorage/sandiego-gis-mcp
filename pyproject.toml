[project]
name = "opencontext"
version = "1.0.0"
description = "Extensible MCP framework template for civic data platforms"
authors = [
    {name = "Srihari Raman", email = "srihari.raman@boston.gov"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Provides the `core` and `server` packages. Keep in step with
    # requirements.txt.
    "opencontext-core @ git+https://github.com/codeforanchorage/opencontext-core@v1.4.0",
    "httpx>=0.27.0",
    "pyclipper>=1.3.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "python-json-logger>=3.1.0",
]

[project.optional-dependencies]
dev = [
    # scripts/local_server.py only; not in the Lambda package.
    "aiohttp>=3.8.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    # Validates tool output against each declared MCP outputSchema
    "jsonschema>=4.0.0",
    # PINNED, not floating: a floating `ruff>=0.1.0` lets CI resolve to
    # whatever ruff released most recently and check rules this tree has
    # never been run against. Keep this equal to the rev in
    # .pre-commit-config.yaml so a contributor's hook, a local run and CI
    # all reach the same verdict. Bump both together, deliberately.
    "ruff==0.15.11",
    "pip-audit>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/thealphacubicle/OpenContext"
Documentation = "https://github.com/thealphacubicle/OpenContext/blob/main/README.md"
Repository = "https://github.com/thealphacubicle/OpenContext"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["plugins*", "custom_plugins*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
# Exclude hard-to-test modules from coverage (formatters, integration-heavy plugin code)
omit = [
    "*/tests/*",
    # Inert in this fork: config.yaml has no entry for it, so it can never
    # be loaded here (One Fork = One Plugin). 1.8k statements at 67% would
    # otherwise dominate the number the gate measures.
    # Legacy entry point; Terraform wires server.adapters.aws_lambda.
    "*/server/lambda_handler.py",
]
